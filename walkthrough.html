<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>We'll Keep Looking: walkthrough</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: the working phone carries the page; small controls above it, a link to the guided walkthrough below. */
:root{
  --bg:#edf1f7; --surface:#ffffff; --fg:#0e1a2b; --muted:#56637a; --line:#d6dde8;
  --accent:#2f6bf2; --accent-soft:#e3ebfd; --today:#b4480b; --today-soft:#fdeee5;
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b111b; --surface:#131b28; --fg:#e8eef8; --muted:#9aa8bf; --line:#253247;
  --accent:#6b98ff; --accent-soft:#1a2a4d; --today:#fb923c; --today-soft:#3a2214; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b111b; --surface:#131b28; --fg:#e8eef8; --muted:#9aa8bf; --line:#253247;
  --accent:#6b98ff; --accent-soft:#1a2a4d; --today:#fb923c; --today-soft:#3a2214; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.solo{max-width:440px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:12px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;max-width:413px}
.brand{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.1;letter-spacing:-.01em}
.brand em{font-style:normal;font-family:var(--body);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:3px 8px;border-radius:999px;margin-left:6px;vertical-align:3px}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%;max-width:413px}
.btn{font:500 13.5px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 13px;border-radius:8px;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);font-weight:600}
.tiny{font-size:12.5px;color:var(--muted);text-align:center;max-width:380px;margin:0}
.case{display:inline-flex;align-items:center;gap:8px;font:600 15px var(--body);color:var(--accent);text-decoration:none;border:1.5px solid var(--accent);border-radius:999px;padding:10px 18px}
.case:hover{background:var(--accent-soft)}
.pill{display:inline-flex;align-items:center;gap:6px;font:500 14px var(--body);padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);text-decoration:none}
.about{position:relative}
.about-btn{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:italic 700 15px/1 Georgia,serif;cursor:pointer;display:grid;place-items:center}
.about-pop{position:absolute;top:40px;right:0;width:min(290px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--muted);box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:40;line-height:1.45}
.about-pop b{color:var(--fg)}
.btn:focus-visible,.pill:focus-visible,.case:focus-visible,.about-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Walkthrough */
.guide{max-width:900px;margin:0 auto;display:grid;gap:16px}
.guide .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.gstage{display:grid;grid-template-columns:auto minmax(0,1fr);gap:36px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px;position:sticky;top:16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kicker{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
.card h2{font-family:var(--display);font-size:25px;line-height:1.15;margin:2px 0 8px;text-wrap:balance;font-weight:700}
.rows{display:grid;gap:10px;margin:4px 0 6px}
.rows div{display:grid;grid-template-columns:62px minmax(0,1fr);gap:12px;align-items:baseline}
.rows b{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--today)}
.rows .n b{color:var(--accent)}
.try{border-left:3px solid var(--accent);padding:2px 0 2px 12px;margin:8px 0}
.done{color:var(--accent);font-weight:600}
.card .ctrl{justify-content:flex-start;max-width:none}
.steps{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:2px;border-top:1px solid var(--line);padding-top:10px}
.steps button{width:100%;text-align:left;background:none;border:0;color:var(--muted);font:14px var(--body);padding:6px 8px;border-radius:6px;cursor:pointer;display:flex;gap:10px}
.steps .num{font-variant-numeric:tabular-nums;width:18px;flex:none}
.steps button[aria-current="true"]{background:var(--accent-soft);color:var(--fg);font-weight:600}
.steps button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
@media (max-width:860px){.gstage{grid-template-columns:minmax(0,1fr);justify-items:center;gap:14px}.card{position:static;width:100%;max-width:440px;order:-1}.card h2{font-size:21px}.steps{display:none}}

/* Phone: Shazam iOS look (dark), drawn at iPhone 16 size 393 x 852 and scaled to fit. */
.pbox{position:relative;flex:none}
.ph{width:393px;height:852px;border-radius:56px;background:#000;position:absolute;top:0;left:0;transform-origin:top left;
  box-shadow:0 0 0 10px #1c1f25,0 0 0 11px #3a3f48,0 30px 60px rgba(10,20,40,.28);overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;color:#fff;-webkit-font-smoothing:antialiased;
  font-size:15px;line-height:1.35;user-select:none;-webkit-tap-highlight-color:transparent}
.ph *{box-sizing:border-box}
.ph button{font-family:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
.ph button:focus-visible,.ph input:focus-visible{outline:2px solid #4f86ff;outline-offset:2px}
.ph .island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:124px;height:36px;border-radius:20px;background:#000;z-index:30}
.ph .sb{position:absolute;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:6px 34px 0 46px;font-weight:600;font-size:16px;z-index:29;pointer-events:none}
.ph .sb .ic{display:flex;gap:6px;align-items:center}
.ph .scr{position:absolute;inset:0;display:flex;flex-direction:column;background:#030a12;overflow:hidden}
.ph .x{position:absolute;top:62px;left:22px;width:46px;height:46px;border-radius:50%;background:#12161c;border:1px solid #2a2f37;display:grid;place-items:center;z-index:5}
.ph .gear{position:absolute;top:62px;right:22px;width:46px;height:46px;border-radius:50%;background:#12161c;border:1px solid #2a2f37;display:grid;place-items:center;z-index:5}
.ph .mark{border-radius:50%;background:#1b1f23;border:1px solid #3b4148;display:grid;place-items:center}
.ph .mark svg{width:46%;height:46%}
.ph .center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;padding:0 34px}
.ph .t1{font-size:24px;font-weight:700;letter-spacing:-.01em}
.ph .t2{font-size:17px;color:#9aa3ad}
.ph .bars{display:flex;gap:4px;align-items:center;height:14px}
.ph .bars i{width:5px;border-radius:3px;background:#fff;display:block;animation:pheq .9s ease-in-out infinite}
.ph .bars i:nth-child(1){height:6px}.ph .bars i:nth-child(2){height:10px;animation-delay:.1s}.ph .bars i:nth-child(3){height:14px;animation-delay:.2s}.ph .bars i:nth-child(4){height:10px;animation-delay:.3s}.ph .bars i:nth-child(5){height:6px;animation-delay:.4s}
@keyframes pheq{50%{transform:scaleY(.45)}}
.ph .rings{position:relative;width:393px;height:430px;display:grid;place-items:center}
.ph .rings b{position:absolute;border-radius:50%;animation:phpulse 2.4s ease-out infinite}
.ph .rings b:nth-child(1){width:400px;height:400px;background:rgba(80,90,100,.25)}
.ph .rings b:nth-child(2){width:320px;height:320px;background:rgba(110,120,130,.35);animation-delay:.3s}
.ph .rings b:nth-child(3){width:240px;height:240px;background:rgba(140,148,156,.55);animation-delay:.6s}
@keyframes phpulse{50%{transform:scale(1.05)}}
.ph .pl{border-radius:999px;font-weight:600;font-size:17px;padding:16px 20px;width:100%;text-align:center!important}
.ph .pl.blue{background:#2f6bf2;color:#fff}
.ph .pl.ghost{background:#20262e}
.ph .pl.line{border:1px solid #3a414b}
/* home */
.ph .homec{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;margin-top:-150px}
.ph .tabs{position:absolute;left:14px;right:14px;bottom:26px;display:flex;gap:10px;align-items:center;z-index:6}
.ph .tabbar{flex:1;height:64px;border-radius:32px;background:#16191d;border:1px solid #2b2f35;display:flex;align-items:center;padding:4px;gap:2px}
.ph .tab{flex:1;height:100%;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:#e8eaed}
.ph .tab.on{background:#2a2e34;color:#4f86ff}
.ph .tab svg{width:22px;height:22px}
.ph .srch{width:64px;height:64px;border-radius:50%;background:#16191d;border:1px solid #2b2f35;display:grid;place-items:center}
.ph .rf{position:absolute;left:24px;right:0;bottom:116px}
.ph .rf h4{margin:0 0 12px;font-size:18px;color:#a4abb4;font-weight:600}
.ph .rfrow{display:flex;gap:12px;overflow:hidden}
.ph .rfc{flex:0 0 300px;background:#0e151d;border:1px solid #1f2731;border-radius:22px;padding:14px;display:flex;gap:14px;align-items:center}
.ph .art{width:64px;height:64px;border-radius:10px;flex:0 0 auto;display:grid;place-items:center;font-weight:800;font-size:15px;letter-spacing:.04em;color:rgba(255,255,255,.92)}
.ph .meta{min-width:0}
.ph .meta small{color:#8b939d;font-size:13px;font-weight:600;display:block}
.ph .meta div{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .meta span{color:#9aa3ad;font-size:14.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* miss */
.ph .miss{flex:1;display:flex;flex-direction:column;padding:130px 26px 40px;gap:22px}
.ph .miss .t1,.ph .miss .t2{text-align:center}
.ph .miss .t2{margin-top:-12px}
.ph .keep{background:#0f1b2e;border:1px solid #23406f;border-radius:22px;padding:18px;display:flex;gap:14px;align-items:flex-start}
.ph .keep .rad{width:44px;height:44px;flex:0 0 auto;border-radius:50%;background:#16305c;display:grid;place-items:center;position:relative}
.ph .keep .rad::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid #4f86ff;opacity:.6;animation:phping 2s ease-out infinite}
@keyframes phping{to{transform:scale(1.35);opacity:0}}
.ph .keep h5{margin:0 0 4px;font-size:17px}
.ph .keep p{margin:0;color:#aab6c6;font-size:14.5px;line-height:1.4}
.ph .fine{font-size:12.5px;color:#7f8892;text-align:center;line-height:1.4}
/* search / lyrics */
.ph .sheet{flex:1;display:flex;flex-direction:column;padding:64px 20px 30px;gap:14px;background:#0b1016}
.ph .shead{display:flex;align-items:center;gap:12px}
.ph .back{width:40px;height:40px;border-radius:50%;background:#12161c;border:1px solid #2a2f37;display:grid;place-items:center;flex:none}
.ph .sheet h3{margin:0;font-size:27px;font-weight:800;line-height:1.1}
.ph .field{background:#1b2027;border-radius:14px;padding:0 14px;display:flex;gap:10px;align-items:center;min-height:50px}
.ph .field input{flex:1;min-width:0;border:0;background:none;color:#fff;font:17px -apple-system,system-ui,sans-serif;outline:none;padding:13px 0;user-select:text}
.ph .field input::placeholder{color:#78818c}
.ph .lbl{font-size:12px;color:#8b939d;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.ph .res{display:flex;flex-direction:column;gap:10px;min-height:0;overflow-y:auto}
.ph .ri{display:flex;gap:12px;align-items:center;background:#0e151d;border:1px solid #1f2731;border-radius:16px;padding:10px;width:100%}
.ph .ri .art{width:52px;height:52px;font-size:12px}
.ph .ri .meta div{font-size:15.5px}
.ph .ri .meta span{font-size:13px}
.ph .ri mark{background:none;color:#7fa6ff;font-weight:600}
.ph .empty{color:#8b939d;font-size:14.5px;padding:6px 2px}
/* library */
.ph .lib{flex:1;display:flex;flex-direction:column;padding:64px 18px 110px;gap:12px;overflow-y:auto;scrollbar-width:none;background:#000}
.ph .lib::-webkit-scrollbar{display:none}
.ph .libh{display:flex;align-items:center;justify-content:space-between}
.ph .libh h3{margin:0;font-size:38px;font-weight:800;letter-spacing:-.02em;line-height:1}
.ph .libh .pillb{display:flex;gap:2px;background:#16191d;border:1px solid #2b2f35;border-radius:24px;padding:4px 6px}
.ph .libh .pillb button{width:38px;height:34px;display:grid;place-items:center}
.ph .cnt{color:#8b939d;font-size:15px;margin-top:-6px}
.ph .still{background:#0f1b2e;border:1px solid #23406f;border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:10px}
.ph .still .row{display:flex;gap:12px;align-items:center}
.ph .wave{width:58px;height:58px;border-radius:12px;background:#16305c;display:grid;place-items:center;flex:0 0 auto}
.ph .prog{height:6px;border-radius:3px;background:#1f2f4d;overflow:hidden}
.ph .prog i{display:block;height:100%;width:3%;background:#4f86ff;border-radius:3px}
.ph .still .f2{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:#93a3bb}
.ph .still .f2 button{color:#ff8a8a;font-size:12.5px;font-weight:600}
.ph .lrow{position:relative;background:#0e151d;border:1px solid #1f2731;border-radius:20px;padding:12px 44px 12px 12px;display:flex;gap:12px;align-items:center;width:100%}
.ph .lrow .meta div{font-size:16px}
.ph .lrow .meta span{font-size:13.5px}
.ph .more{position:absolute;top:6px;right:8px;color:#8b939d;font-size:19px;line-height:1;letter-spacing:1px;padding:6px 8px;border-radius:12px}
.ph .badge{position:absolute;right:12px;bottom:12px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:#12341f;color:#5be08f;white-space:nowrap}
/* song */
.ph .song{flex:1;display:flex;flex-direction:column;padding:118px 24px 40px;gap:14px}
.ph .bigart{width:210px;height:210px;border-radius:18px;align-self:center;font-size:42px}
.ph .chip{align-self:center;background:rgba(79,134,255,.18);color:#9dbbff;border:1px solid rgba(79,134,255,.45);font-size:13px;font-weight:700;padding:5px 11px;border-radius:999px}
.ph .chip.g{background:rgba(91,224,143,.14);color:#7fe8a8;border-color:rgba(91,224,143,.4)}
.ph .rt{text-align:center}
.ph .rt div{font-size:27px;font-weight:800;letter-spacing:-.01em;line-height:1.15}
.ph .rt span{font-size:18px;color:#c3c8cf}
.ph .heard{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:#a7afba;background:rgba(255,255,255,.07);border-radius:14px;padding:10px 14px}
.ph .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ph .two .pl{font-size:15.5px;padding:14px 8px;background:rgba(255,255,255,.12)}
.ph .wrong{text-align:center!important;font-size:14px;color:#aab1ba;align-self:center}
/* settings */
.ph .set{flex:1;display:flex;flex-direction:column;background:#000}
.ph .sethead{height:120px;flex:none;display:flex;align-items:flex-end;justify-content:center;padding-bottom:22px;font-size:20px;font-weight:700;background:#111820;border-radius:34px 34px 0 0;margin-top:56px;position:relative}
.ph .sethead .x{top:24px}
.ph .setb{flex:1;overflow-y:auto;scrollbar-width:none;padding-bottom:30px}
.ph .setb::-webkit-scrollbar{display:none}
.ph .sg{padding:18px 22px 0}
.ph .sg h6{margin:0 0 6px;font-size:17px;color:#8f99a5;font-weight:700}
.ph .srow{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #1d242c;font-size:17px;gap:10px;width:100%}
.ph .srow small{display:block;font-size:13px;color:#8b939d;margin-top:2px}
.ph .tg{width:58px;height:34px;border-radius:17px;background:#3a3f46;position:relative;flex:0 0 auto;transition:background .15s}
.ph .tg::after{content:"";position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:50%;background:#fff;transition:left .15s}
.ph .tg[aria-checked="true"]{background:#2f6bf2}
.ph .tg[aria-checked="true"]::after{left:27px}
.ph .val{color:#8b939d;font-size:16px;white-space:nowrap}
.ph .newband{background:#0d1726;border:1px solid #23406f;border-radius:18px;padding:2px 16px;margin-top:6px}
.ph .newband .srow:last-child{border-bottom:0}
.ph .newtag{font-size:12px;background:#16305c;color:#9dbbff;border-radius:6px;padding:2px 6px;margin-left:6px}
/* lock */
.ph .lock{background:radial-gradient(120% 80% at 30% 10%,#3b4f8f 0%,#1a1f3d 45%,#08090f 100%)}
.ph .ldate{margin-top:96px;text-align:center;font-size:20px;font-weight:600;color:rgba(255,255,255,.85)}
.ph .ltime{text-align:center;font-size:96px;font-weight:700;letter-spacing:-.03em;line-height:1;margin-top:2px}
.ph .notif{margin:auto 12px 150px;background:rgba(40,44,60,.75);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:24px;padding:14px;display:flex;gap:12px;width:calc(100% - 24px);animation:phin .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes phin{from{transform:translateY(30px);opacity:0}}
.ph .appic{width:40px;height:40px;border-radius:10px;background:linear-gradient(160deg,#4f86ff,#1b4fd0);display:grid;place-items:center;flex:0 0 auto}
.ph .notif .top{display:flex;justify-content:space-between;font-size:13px;color:rgba(255,255,255,.7);font-weight:600}
.ph .notif b{display:block;font-size:15.5px;margin:2px 0}
.ph .notif p{margin:0;font-size:14.5px;color:rgba(255,255,255,.88);line-height:1.35}
.ph .homebar{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);width:140px;height:5px;border-radius:3px;background:rgba(255,255,255,.85)}
.ph .unlock{position:absolute;bottom:30px;left:0;right:0;text-align:center!important;font-size:14px;color:rgba(255,255,255,.75)}
/* overlays */
.ph .dim{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:20}
.ph .menu{position:absolute;right:18px;width:250px;background:#1a1b1e;border:1px solid #33363c;border-radius:26px;padding:8px 0;z-index:21;box-shadow:0 20px 40px rgba(0,0,0,.6)}
.ph .menu .mh{font-size:13px;color:#8b939d;padding:6px 20px 4px}
.ph .menu button{display:flex;gap:14px;align-items:center;padding:11px 20px;font-size:16px;width:100%;border-top:1px solid #2a2d33}
.ph .menu button.first{border-top:0}
.ph .menu button.red{color:#ff6b6b}
.ph .menu svg{width:20px;height:20px;flex:0 0 auto}
.ph .dlg{position:absolute;left:28px;right:28px;top:300px;background:#1a1b1e;border:1px solid #33363c;border-radius:30px;padding:24px 22px 20px;z-index:21;display:flex;flex-direction:column;gap:18px;box-shadow:0 20px 40px rgba(0,0,0,.6)}
.ph .dlg p{margin:0;font-size:18px;line-height:1.4}
.ph .dlg .acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ph .dlg .acts button{background:#2a2c31;border-radius:22px;padding:13px 0;text-align:center!important;font-size:17px;font-weight:600}
.ph .dlg .acts button.red{color:#ff6b6b}
.ph .toast{position:absolute;left:24px;right:24px;bottom:112px;background:#2b2f36;color:#fff;border-radius:16px;padding:12px 16px;font-size:14.5px;text-align:center;z-index:25;box-shadow:0 10px 24px rgba(0,0,0,.4)}
.ph .pulse{animation:phhint 1.6s ease-in-out infinite}
@keyframes phhint{0%,100%{box-shadow:0 0 0 0 rgba(79,134,255,.75)}50%{box-shadow:0 0 0 9px rgba(79,134,255,0)}}
.ph .a1{background:linear-gradient(135deg,#e56b2f,#7a1d5f)} .ph .a2{background:linear-gradient(135deg,#1f8f86,#163a6b)} .ph .a3{background:linear-gradient(135deg,#d6b23a,#5e3b12)}
.ph .a4{background:linear-gradient(135deg,#7b5cff,#1d2f7a)} .ph .a5{background:linear-gradient(135deg,#ef4f86,#4a1442)} .ph .a6{background:linear-gradient(135deg,#3fa34d,#174a2a)}

</style>
</head>
<body>
<script>
/* Shazam-style iPhone app with the "We'll Keep Looking" concept built in.
   Independent concept prototype by Pritesh Kabra: not affiliated with Apple or Shazam. Songs and artists are invented. */
window.SZ = (function () {
const SONGS = {
  cd: {t: 'Chandani Dhol (Sped Up)', a: 'Mira Kale', ini: 'CD', c: 'a1', bg: '#5a2a1f', lyr: 'dhol vajto saari raat, chandani zhali'},
  ml: {t: 'Monsoon Letters', a: 'Aarav & the Lanterns', ini: 'ML', c: 'a2', bg: '#123c4a', lyr: 'paus aala parat, patra bhijli'},
  nb: {t: 'Nightbus Radio', a: 'Saffron Static', ini: 'NB', c: 'a3', bg: '#4a3410', lyr: 'last bus home, radio low'},
  gv: {t: 'Gulaal Vaara', a: 'Ved & Sons', ini: 'GV', c: 'a4', bg: '#24205a', lyr: 'dhol vajto gaavat, gulaal udto'},
  sb: {t: 'Sangeet Bass', a: 'DJ Orbit', ini: 'SB', c: 'a5', bg: '#4a1430', lyr: 'raat ajun baaki, nachuya saare'},
  rr: {t: 'Raat Ranga', a: 'Kavya Joshi', ini: 'RR', c: 'a6', bg: '#173f25', lyr: 'raat ranga, swapna saare'}
};
const HEARD = 'Sat, 18 Oct at 11:42 PM';
const esc = s => String(s).replace(/[&<>"]/g, m => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[m]));
const LOGO = '<svg viewBox="0 0 40 40" aria-hidden="true"><g fill="currentColor"><rect x="5" y="15" width="4.5" height="10" rx="2.25"/><rect x="12" y="9" width="4.5" height="22" rx="2.25"/><rect x="19" y="4" width="4.5" height="32" rx="2.25"/><rect x="26" y="10" width="4.5" height="20" rx="2.25"/><rect x="33" y="16" width="4.5" height="8" rx="2.25"/></g></svg>';
const X = '<svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 4l12 12M16 4L4 16" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>';
const BACK = '<svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4 6.5 10l6 6" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const GEAR = '<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2" fill="none" stroke="#fff" stroke-width="2.4"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>';
const SEARCH = c => `<svg width="${c}" height="${c}" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M15 15l5.5 5.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>`;
const SORT = '<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16M3.5 7.5 7 4l3.5 3.5M17 20V4M13.5 16.5 17 20l3.5-3.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const MORE = '<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><g fill="#fff"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></g></svg>';
const WAVE = '<svg width="30" height="22" viewBox="0 0 30 22" aria-hidden="true"><g fill="#7fa6ff"><rect x="0" y="8" width="3.5" height="6" rx="1.75"/><rect x="6.5" y="4" width="3.5" height="14" rx="1.75"/><rect x="13" y="0" width="3.5" height="22" rx="1.75"/><rect x="19.5" y="5" width="3.5" height="12" rx="1.75"/><rect x="26" y="9" width="3.5" height="4" rx="1.75"/></g></svg>';
const REDO = '<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M11 3a8 8 0 1 1-7.4 5" fill="none" stroke="#7fa6ff" stroke-width="2.2" stroke-linecap="round"/><path d="M2 4l1.6 4.2L8 7" fill="none" stroke="#7fa6ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const MI = {
  am: '<svg viewBox="0 0 20 20"><rect x="2" y="2" width="16" height="16" rx="4" fill="#fff"/><path d="M11.5 5.5v6.2a1.8 1.8 0 1 1-1.3-1.7V5.5h3" fill="none" stroke="#1a1b1e" stroke-width="1.4"/></svg>',
  sp: '<svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="#fff"/><path d="M5.5 8c3-1 6-.7 9 .8M6 10.6c2.5-.8 5-.5 7.5.7M6.6 13c2-.6 4-.4 6 .5" fill="none" stroke="#1a1b1e" stroke-width="1.3" stroke-linecap="round"/></svg>',
  rm: '<svg viewBox="0 0 20 20"><path d="M4 6h12M8 6V4h4v2M6 6l1 11h6l1-11" fill="none" stroke="#ff6b6b" stroke-width="1.6" stroke-linejoin="round"/></svg>',
  flag: '<svg viewBox="0 0 20 20"><path d="M5 18V3M5 4h9l-2 3.5 2 3.5H5" fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>',
  artist: '<svg viewBox="0 0 20 20"><circle cx="9" cy="7" r="3.5" fill="none" stroke="#fff" stroke-width="1.6"/><path d="M3 17c.8-3 3.2-4.5 6-4.5" fill="none" stroke="#fff" stroke-width="1.6"/></svg>',
  share: '<svg viewBox="0 0 20 20"><path d="M10 2v11M6.5 5.5 10 2l3.5 3.5M5 9H4v9h12V9h-1" fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>'
};
const art = (id, cls = '') => `<div class="art ${SONGS[id].c} ${cls}">${SONGS[id].ini}</div>`;

function mount(host) {
  let S, timers = [], scale = 1;
  const subs = [];
  const fresh = () => ({
    stack: [{s: 'home'}], phase: 0, pending: null, found: false, day: 'sat', keepOn: true, notify: true, days: 30, sound: 'music', playing: false, confirmed: false, rejected: false,
    lib: [{id: 'ml', when: 'Thu, 16 Oct at 9:05 PM', ago: '2 days ago'}, {id: 'nb', when: 'Mon, 13 Oct at 7:40 PM', ago: 'Last week'}],
    q: '', overlay: null, toast: null, hint: null, lyrNone: false, opened: false, reported: false
  });
  S = fresh();
  host.innerHTML = '<div class="pbox"><div class="ph" role="application" aria-label="Shazam concept phone"></div></div>';
  const box = host.firstChild, ph = box.firstChild;

  const top = () => S.stack[S.stack.length - 1];
  const clear = () => { timers.forEach(clearTimeout); timers = []; };
  const later = (fn, ms) => timers.push(setTimeout(fn, ms));
  let toastT;
  function toast(t) { S.toast = t; render(); clearTimeout(toastT); toastT = setTimeout(() => { S.toast = null; render(); }, 2400); }
  const nope = () => toast('Not part of this prototype');
  function go(s, extra) { clear(); S.overlay = null; S.stack.push(Object.assign({s}, extra || {})); render(); }
  function replace(s, extra) { clear(); S.overlay = null; S.stack[S.stack.length - 1] = Object.assign({s}, extra || {}); render(); }
  function back() { clear(); S.overlay = null; if (S.stack.length > 1) S.stack.pop(); else S.stack = [{s: 'home'}]; render(); }
  function inLib(id) { return S.lib.find(x => x.id === id); }

  function listen() {
    S.phase = 0;
    if (S.sound === 'talk') { later(() => outcome(), 2600); return; }
    if (S.found) { later(() => outcome(), 2200); return; }
    later(() => { S.phase = 1; render(); }, 1600);
    later(() => { S.phase = 2; render(); }, 3100);
    later(() => outcome(), 4600);
  }
  function outcome() {
    if (S.sound === 'talk') return replace('nomusic');
    if (S.found) {
      if (!inLib('cd')) S.lib.unshift({id: 'cd', when: 'Just now', ago: 'Just now'});
      return replace('song', {id: 'cd', src: 'now'});
    }
    let merged = false;
    if (S.keepOn) { if (S.pending) { S.pending.tries++; merged = true; } else S.pending = {when: HEARD, tries: 1, state: 'search'}; }
    replace('miss', {merged});
  }
  function skip() {
    if (!S.pending) { toast('Nothing to look for yet. Let Shazam miss a song first.'); return false; }
    if (S.rejected) { toast('No new match yet. Shazam is still looking.'); return false; }
    clear(); S.day = 'tue'; S.pending.state = 'match'; S.overlay = null; S.playing = false;
    if (S.notify) S.stack = [{s: 'lock'}];
    else { S.stack = [{s: 'home'}]; S.toast = 'Possible match for Saturday’s song. Check Library.'; }
    render(); return true;
  }
  function yes() {
    clear(); S.found = true; S.confirmed = true; S.pending = null; S.overlay = null; S.playing = false; S.day = 'tue';
    S.lib = S.lib.filter(x => x.id !== 'cd');
    S.lib.unshift({id: 'cd', when: HEARD, ago: 'Found today', rescued: true});
    S.stack = [{s: 'home'}, {s: 'song', id: 'cd', src: 'rescued'}]; render();
  }

  /* ---------- screens ---------- */
  const H = k => (S.hint && (S.hint === k || (Array.isArray(S.hint) && S.hint.includes(k)))) ? ' pulse' : '';
  const tabs = on => `<div class="tabs"><div class="tabbar">
    <button class="tab ${on === 'home' ? 'on' : ''}" data-a="tab-home">${LOGO.replace('aria-hidden="true"', 'aria-hidden="true" width="22" height="22"')}Home</button>
    <button class="tab ${on === 'lib' ? 'on' : ''}${H('tab-lib')}" data-a="tab-lib"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="3" fill="currentColor" opacity=".9"/><path d="M13 7v7.2a2.2 2.2 0 1 1-1.6-2.1V7h3.6" fill="none" stroke="#16191d" stroke-width="1.6"/></svg>Library</button>
    <button class="tab" data-a="nope"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9.5 9.5 3l2 2a2 2 0 0 0 2.8 2.8l2 2-6.5 6.5-2-2A2 2 0 0 0 5 11.5z" fill="currentColor" transform="translate(2 2)"/></svg>Concerts</button>
  </div><button class="srch${H('search')}" data-a="search" aria-label="Search">${SEARCH(28)}</button></div>`;

  function home() {
    const recent = S.lib.slice(0, 3);
    return `<div class="scr">
      <button class="gear${H('gear')}" data-a="settings" aria-label="Settings">${GEAR}</button>
      <div class="homec"><div class="t1" style="font-size:34px;font-weight:800">Tap to Shazam</div>
        <button class="mark${H('shazam')}" data-a="listen" aria-label="Tap to Shazam" style="width:240px;height:240px;color:#fff">${LOGO}</button></div>
      ${recent.length ? `<div class="rf"><h4>Recently Found</h4><div class="rfrow">${recent.map(x => `<button class="rfc" data-a="song" data-v="${x.id}">${art(x.id)}<div class="meta"><small>${esc(x.ago)}</small><div>${esc(SONGS[x.id].t)}</div><span>${esc(SONGS[x.id].a)}</span></div></button>`).join('')}</div></div>` : ''}
      ${tabs('home')}</div>`;
  }
  function listenScr() {
    const p = S.phase;
    const t = p === 0 ? ['Listening for music', 'Make sure your device can hear the song clearly'] : p === 1 ? ['Expanding search', 'Hang tight'] : ['This is tough', 'Last try'];
    return `<div class="scr"><button class="x" data-a="cancel" aria-label="Stop listening">${X}</button>
      <div class="center" style="gap:0">
        ${p === 0 ? `<div class="rings"><b></b><b></b><b></b><div class="mark" style="width:190px;height:190px;position:relative;color:#fff">${LOGO}</div></div>`
                  : `<div style="height:430px;display:grid;place-items:center"><div class="mark" style="width:210px;height:210px;color:#fff">${LOGO}</div></div>`}
        <div style="display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:20px">
          <div class="bars"><i></i><i></i><i></i><i></i><i></i></div>
          <div class="t1">${t[0]}</div><div class="t2">${t[1]}</div></div></div></div>`;
  }
  function missScr() {
    if (!S.keepOn) return `<div class="scr" style="background:#1f2225"><button class="x" data-a="close" aria-label="Close">${X}</button>
      <div class="center" style="justify-content:flex-start;padding-top:210px;gap:18px">
        <div style="width:90px;height:90px;border-radius:50%;background:#fff;display:grid;place-items:center"><svg width="16" height="52" viewBox="0 0 16 52" aria-hidden="true"><path d="M3 4h10l-2.5 30h-5z" fill="#1f2225"/><circle cx="8" cy="45" r="5" fill="#1f2225"/></svg></div>
        <div class="t1" style="font-size:34px;font-weight:800">No Result</div><div class="t2" style="margin-top:-8px">We didn’t quite catch that</div>
        <button class="pl blue" style="margin-top:20px" data-a="retry">Try Again</button></div></div>`;
    return `<div class="scr" style="background:#11161c"><button class="x" data-a="close" aria-label="Close">${X}</button>
      <div class="miss">
        <div class="t1" style="font-size:31px;font-weight:800;margin-top:10px">Not found yet</div>
        <div class="t2">We heard music, but couldn’t name it yet</div>
        <div class="keep"><div class="rad">${REDO}</div><div><h5>${top().merged ? 'Added to the same search' : 'We’ll keep looking'}</h5><p>${top().merged ? `Your ${S.pending ? S.pending.tries : 2} tries are combined into one search. More sound means a better chance.` : `Over the next ${S.days} days we’ll try other speeds, every country’s catalogue and new releases. ${S.notify ? 'If we find a likely match, we’ll ask you to confirm it.' : 'Check Library to see if we found it.'}`}</p></div></div>
        <button class="pl line${H('lyrics-btn')}" data-a="lyrics">Remember any words? Search lyrics</button>
        <button class="pl blue" data-a="retry">Try Again</button>
        <div class="fine" style="margin-top:auto">We heard 14 seconds of music at 11:42 PM.<br>We saved a sound thumbprint (codes), not a recording.</div></div></div>`;
  }
  function noMusicScr() {
    return `<div class="scr" style="background:#1f2225"><button class="x" data-a="close" aria-label="Close">${X}</button>
      <div class="center" style="justify-content:flex-start;padding-top:200px;gap:18px">
        <div style="width:90px;height:90px;border-radius:50%;background:#2c3138;display:grid;place-items:center"><svg width="44" height="44" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l10-2v12" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="2.5" fill="none" stroke="#fff" stroke-width="2"/><circle cx="16.5" cy="16" r="2.5" fill="none" stroke="#fff" stroke-width="2"/><path d="M3 3l18 18" stroke="#ff8a8a" stroke-width="2.2" stroke-linecap="round"/></svg></div>
        <div class="t1" style="font-size:30px;font-weight:800">We didn’t hear music</div>
        <div class="t2" style="margin-top:-8px">It sounded like people talking. Nothing was saved.</div>
        <button class="pl blue" style="margin-top:20px" data-a="retry">Try Again</button>
        <div class="fine" style="margin-top:6px">Hold your phone closer to the speaker when the song plays.</div></div></div>`;
  }
  function confirmScr() {
    const s = SONGS.cd;
    return `<div class="scr" style="background:linear-gradient(180deg,${s.bg} 0%,#1a1220 42%,#030a12 78%)"><button class="x" data-a="close" aria-label="Close">${X}</button>
      <div class="song">${art('cd', 'bigart')}<div class="chip">Possible match</div>
        <div class="rt"><div>Is this your song?</div><span>${esc(s.t)} · ${esc(s.a)}</span></div>
        <button class="heard${H('play')}" data-a="play" style="justify-content:center;gap:12px;align-items:center;font-size:15px;color:#fff;font-weight:600">${S.playing ? '<span class="bars"><i></i><i></i><i></i><i></i><i></i></span> Playing the part you heard · 1:04 – 1:18' : '▶ Play the part you heard (1:04 – 1:18)'}</button>
        <div class="fine">Heard Sat, 18 Oct at 11:42 PM · found 3 days later</div>
        <div class="two"><button class="pl ghost" data-a="no">No, keep looking</button><button class="pl blue${H('yes')}" data-a="yes">Yes, that’s it</button></div>
      </div></div>`;
  }
  function results() {
    const q = S.q.trim().toLowerCase();
    if (q.length < 2) return `<div class="empty">${top().mode === 'lyrics' ? 'Type any words you remember from the song.' : 'Search songs, artists or lyrics.'}</div>`;
    const words = q.split(/\s+/).filter(w => w.length >= 2);
    const ids = Object.keys(SONGS).filter(id => id !== 'cd' || S.found);
    const hits = ids.map(id => {
      const s = SONGS[id], hay = (s.lyr + ' ' + s.t + ' ' + s.a).toLowerCase();
      const n = words.filter(w => hay.includes(w)).length;
      return {id, n};
    }).filter(h => h.n > 0).sort((a, b) => b.n - a.n).slice(0, 4);
    if (!hits.length) return `<div class="empty">No songs match yet.${top().mode === 'lyrics' && S.keepOn ? ' We’re still looking with the sound you caught.' : ''}</div>`;
    const mark = txt => { let out = esc(txt); words.forEach(w => { out = out.replace(new RegExp('(' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi'), '<mark>$1</mark>'); }); return out; };
    return hits.map(h => `<button class="ri" data-a="song" data-v="${h.id}" data-src="lyrics">${art(h.id)}<div class="meta"><div>${esc(SONGS[h.id].t)}</div><span>“…${mark(SONGS[h.id].lyr)}…” · ${esc(SONGS[h.id].a)}</span></div></button>`).join('');
  }
  function lyricsScr() {
    const ly = top().mode === 'lyrics';
    return `<div class="scr"><div class="sheet">
      <div class="shead"><button class="back" data-a="back" aria-label="Back">${BACK}</button><div class="lbl">${ly ? 'Search by lyrics' : 'Search'}</div></div>
      <h3>${ly ? 'Remember any words?' : 'Search'}</h3>
      <label class="field${H('lyr-q')}">${SEARCH(20).replace('currentColor', '#8b939d').replace('currentColor', '#8b939d')}<input id="sz-q" type="search" autocomplete="off" placeholder="${ly ? 'A line from the song' : 'Songs, artists or lyrics'}" value="${esc(S.q)}" aria-label="Search lyrics"></label>
      <div class="lbl">${ly ? 'Lyrics matches' : 'Results'}</div>
      <div class="res" id="sz-res">${results()}</div>
      ${ly && S.keepOn ? `<button class="pl ghost${H('none')}" data-a="none" style="margin-top:auto">None of these. Keep looking</button><div class="fine">The thumbprint keeps working in the background.</div>` : ''}
    </div></div>`;
  }
  function libScr() {
    const p = S.pending;
    return `<div class="scr" style="background:#000"><div class="lib" id="sz-lib">
      <div class="libh"><h3>Library</h3><div class="pillb"><button data-a="nope" aria-label="Sort">${SORT}</button><button data-a="nope" aria-label="More">${MORE}</button></div></div>
      <div class="cnt">${S.lib.length} song${S.lib.length === 1 ? '' : 's'}${p ? ' · 1 still looking' : ''}</div>
      ${p ? `<div class="lbl" style="margin-top:4px">Still looking</div>
      <div class="still${H('still')}"><div class="row"><div class="wave">${WAVE}</div><div class="meta"><div>Song from Saturday night</div><span>${p.when} · 14 sec of music${p.tries > 1 ? ' · ' + p.tries + ' tries combined' : ''}</span></div></div>
        ${p.state === 'match' ? `<button class="pl blue" data-a="check" style="padding:11px;font-size:15px">Possible match found. Is this it?</button>` : `<div class="fine" style="text-align:left">Trying other speeds, every country’s catalogue and new releases</div><div class="prog"><i style="width:${S.day === 'sat' ? 3 : 13}%"></i></div>`}
        <div class="f2"><span>Day ${S.day === 'sat' ? 1 : 4} of ${S.days}</span><button data-a="stop">Stop looking</button></div></div>` : ''}
      ${S.lib.length ? `<div class="lbl" style="margin-top:4px">Recent</div>` : ''}
      ${S.lib.map(x => `<div class="lrow" data-row="${x.id}"><button style="display:flex;gap:12px;align-items:center;flex:1;min-width:0" data-a="song" data-v="${x.id}">${art(x.id)}<div class="meta"><div>${esc(SONGS[x.id].t)}</div><span>${esc(SONGS[x.id].a)}</span><span>${esc(x.when)}</span></div></button><button class="more${H('more-' + x.id)}" data-a="more" data-v="${x.id}" aria-label="More options for ${esc(SONGS[x.id].t)}">•••</button>${x.rescued ? '<span class="badge">Found later</span>' : ''}</div>`).join('')}
      ${!S.lib.length && !p ? '<div class="empty">Songs you Shazam show up here.</div>' : ''}
    </div>${tabs('lib')}</div>`;
  }
  function songScr() {
    const t = top(), s = SONGS[t.id], item = inLib(t.id);
    const rescued = item && item.rescued, fromLyr = t.src === 'lyrics' && !item;
    let chip = '', heard = '';
    if (rescued) { chip = '<div class="chip">Found 3 days later · confirmed by you</div>'; heard = '<span>Heard Sat, 11:42 PM</span><span>You caught 1:04 – 1:18</span>'; }
    else if (t.src === 'now') { chip = '<div class="chip g">Found</div>'; heard = '<span>Shazamed just now</span><span>Matched at 1:10</span>'; }
    else if (fromLyr) { chip = '<div class="chip">Lyrics match</div>'; heard = `<span>“${esc(s.lyr.split(',')[0])}”</span><span>Not your song? Go back</span>`; }
    else if (item) { heard = `<span>Shazamed ${esc(item.when)}</span>`; }
    return `<div class="scr" style="background:linear-gradient(180deg,${s.bg} 0%,#1a1220 42%,#030a12 78%)"><button class="x" data-a="back" aria-label="Close">${X}</button>
      <div class="song">${art(t.id, 'bigart')}${chip}
        <div class="rt"><div>${esc(s.t)}</div><span>${esc(s.a)}</span></div>
        ${heard ? `<div class="heard">${heard}</div>` : ''}
        <div class="two"><button class="pl${H('open-Spotify')}" data-a="open" data-v="Spotify">Open in Spotify</button><button class="pl" data-a="open" data-v="Apple Music">Open in Apple Music</button></div>
        ${item ? `<button class="wrong${H('report')}" data-a="report" data-v="${t.id}">Wrong song? Tell Shazam</button>` : ''}
      </div></div>`;
  }
  function settingsScr() {
    const tg = (k, label) => `<button class="tg${H('tog-' + k)}" role="switch" aria-checked="${S[k]}" aria-label="${label}" data-a="tog" data-v="${k}"></button>`;
    return `<div class="scr" style="background:#000"><div class="set">
      <div class="sethead"><button class="x" data-a="back" aria-label="Close">${X}</button>Settings</div>
      <div class="setb">
        <div class="sg"><h6>Preferences</h6>
          <button class="srow" data-a="nope">iCloud Sync <span class="val">›</span></button>
          <button class="srow" data-a="nope">Notifications <span class="val">›</span></button>
          <div class="srow">Identify songs on app start <span class="tg" aria-hidden="true" style="background:#2f6bf2"></span></div></div>
        <div class="sg"><h6 style="color:#7fa6ff">Keep Looking <span class="newtag">New</span></h6>
          <div class="newband">
            <div class="srow"><div>Keep looking after a miss<small>Re-check songs we couldn’t find</small></div>${tg('keepOn', 'Keep looking after a miss')}</div>
            <button class="srow" data-a="days"><div>Keep thumbprints for</div><span class="val">${S.days} days ›</span></button>
            <div class="srow"><div>Tell me when it’s found</div>${tg('notify', 'Tell me when it’s found')}</div>
            <button class="srow" data-a="delprints"><div style="color:#ff8a8a">Delete saved thumbprints</div><span class="val">${S.pending ? 1 : 0}</span></button>
          </div>
          <div class="fine" style="text-align:left;margin-top:10px">Shazam saves a thumbprint of the sound (a short list of codes), never the audio itself.</div></div>
      </div></div></div>`;
  }
  function lockScr() {
    return `<div class="scr lock"><div class="ldate">Tuesday 21 October</div><div class="ltime">7:48</div>
      <button class="notif${H('notif')}" data-a="notif" aria-label="Open notification: possible match for your song">
        <div class="appic" style="color:#fff">${LOGO.replace('aria-hidden="true"', 'aria-hidden="true" width="22" height="22"')}</div>
        <div style="flex:1;min-width:0;text-align:left"><div class="top"><span>SHAZAM</span><span>now</span></div>
          <b>Is this your song from Saturday night?</b><p>We think we found it. Tap to hear the part you caught.</p></div></button>
      <button class="unlock" data-a="unlock">Swipe up to open</button><div class="homebar"></div></div>`;
  }
  function overlay() {
    const o = S.overlay; if (!o) return '';
    if (o.t === 'menu') {
      const id = o.id;
      return `<div class="dim" data-a="closeov"></div><div class="menu" id="sz-menu" style="top:${o.y || 300}px">
        <div class="mh">Listen On:</div>
        <button class="first" data-a="open" data-v="Apple Music">${MI.am}Apple Music</button>
        <button data-a="open" data-v="Spotify">${MI.sp}Spotify</button>
        <button class="red" data-a="rm" data-v="${id}">${MI.rm}Remove from Library</button>
        <button class="${H('report')}" data-a="report" data-v="${id}">${MI.flag}Wrong Song? Tell Shazam</button>
        <button data-a="nope">${MI.artist}Go to Artist</button>
        <button data-a="nope">${MI.share}Share</button></div>`;
    }
    const dlg = (p, a, b) => `<div class="dim" data-a="closeov"></div><div class="dlg" role="dialog"><p>${p}</p><div class="acts">${a}${b}</div></div>`;
    if (o.t === 'report') return dlg('Song reported! Thanks for letting us know. Would you like to remove this song from your library?', '<button data-a="closeov">Keep</button>', `<button class="red" data-a="rm" data-v="${o.id}">Remove</button>`);
    if (o.t === 'stop') return dlg('Stop looking for the song from Saturday night? We’ll delete its thumbprint.', '<button data-a="closeov">Keep looking</button>', '<button class="red" data-a="confirmstop">Stop</button>');
    return '';
  }

  function render() {
    const t = top().s;
    const scr = {home, listen: listenScr, miss: missScr, nomusic: noMusicScr, confirm: confirmScr, lyrics: lyricsScr, library: libScr, song: songScr, settings: settingsScr, lock: lockScr}[t]();
    const time = S.day === 'sat' ? '11:42' : '7:48';
    const hadFocus = document.activeElement && document.activeElement.id === 'sz-q';
    const libScroll = (ph.querySelector('#sz-lib') || {}).scrollTop || 0;
    ph.innerHTML = `<div class="island"></div>${t === 'lock' ? '' : `<div class="sb"><span>${time}</span><span class="ic"><svg width="18" height="12" viewBox="0 0 18 12" aria-hidden="true"><rect x="0" y="8" width="3" height="4" rx="1" fill="#fff"/><rect x="5" y="5" width="3" height="7" rx="1" fill="#fff"/><rect x="10" y="2" width="3" height="10" rx="1" fill="#fff"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#fff" opacity=".35"/></svg><svg width="26" height="13" viewBox="0 0 26 13" aria-hidden="true"><rect x=".5" y=".5" width="22" height="12" rx="3.5" stroke="#fff" fill="none" opacity=".5"/><rect x="2" y="2" width="14" height="9" rx="2" fill="#fff"/><rect x="24" y="4" width="2" height="5" rx="1" fill="#fff" opacity=".5"/></svg></span></div>`}${scr}${overlay()}${S.toast ? `<div class="toast" role="status">${esc(S.toast)}</div>` : ''}`;
    const lib = ph.querySelector('#sz-lib'); if (lib) lib.scrollTop = libScroll;
    const q = ph.querySelector('#sz-q');
    if (q) { q.addEventListener('input', () => { S.q = q.value; ph.querySelector('#sz-res').innerHTML = results(); subs.forEach(f => f(S)); }); if (hadFocus) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }
    if (S.overlay && S.overlay.t === 'menu' && S.overlay.y == null) {
      const row = ph.querySelector(`[data-row="${S.overlay.id}"]`), m = ph.querySelector('#sz-menu');
      if (row && m) {
        const pr = ph.getBoundingClientRect(), rr = row.getBoundingClientRect();
        const y = (rr.bottom - pr.top) / scale - 8;
        S.overlay.y = Math.max(70, Math.min(y, 852 - m.offsetHeight - 30));
        m.style.top = S.overlay.y + 'px';
      }
    }
    subs.forEach(f => f(S));
  }

  ph.addEventListener('click', e => {
    const el = e.target.closest('[data-a]'); if (!el || !ph.contains(el)) return;
    const a = el.dataset.a, v = el.dataset.v;
    switch (a) {
      case 'listen': go('listen'); listen(); render(); break;
      case 'retry': replace('listen'); listen(); render(); break;
      case 'cancel': back(); break;
      case 'close': clear(); S.stack = [{s: 'home'}]; S.overlay = null; render(); break;
      case 'back': back(); break;
      case 'lyrics': S.q = ''; go('lyrics', {mode: 'lyrics'}); break;
      case 'search': S.q = ''; clear(); S.overlay = null; S.stack = [{s: 'home'}, {s: 'lyrics', mode: 'search'}]; render(); break;
      case 'none': S.lyrNone = true; clear(); S.stack = [{s: 'home'}]; toast('We’ll keep looking. Find it in Library.'); break;
      case 'song': go('song', {id: v, src: el.dataset.src || ''}); break;
      case 'tab-home': clear(); S.overlay = null; S.stack = [{s: 'home'}]; render(); break;
      case 'tab-lib': clear(); S.overlay = null; S.stack = [{s: 'library'}]; render(); break;
      case 'settings': go('settings'); break;
      case 'tog': S[v] = !S[v]; toast(v === 'keepOn' ? (S.keepOn ? 'Shazam will keep looking after a miss.' : 'Misses won’t be saved. You’ll see today’s “No Result”.') : (S.notify ? 'You’ll get one notification when a song is found.' : 'Found songs will appear in Library, without a notification.')); break;
      case 'days': S.days = S.days === 30 ? 90 : S.days === 90 ? 7 : 30; render(); break;
      case 'delprints': if (S.pending) { S.overlay = {t: 'stop'}; render(); } else toast('No saved thumbprints.'); break;
      case 'stop': S.overlay = {t: 'stop'}; render(); break;
      case 'confirmstop': S.pending = null; S.overlay = null; toast('Stopped looking. Thumbprint deleted.'); break;
      case 'more': S.overlay = {t: 'menu', id: v}; render(); break;
      case 'open': S.opened = true; S.overlay = null; toast('Opens ' + v + '. That part isn’t in this prototype.'); break;
      case 'report': S.reported = true; S.overlay = {t: 'report', id: v}; render(); break;
      case 'rm': S.lib = S.lib.filter(x => x.id !== v); S.overlay = null; if (top().s === 'song' && top().id === v) S.stack.pop(); toast('Removed from Library'); break;
      case 'closeov': S.overlay = null; render(); break;
      case 'notif': case 'check': clear(); S.playing = false; S.stack = [{s: 'home'}, {s: 'confirm'}]; render(); break;
      case 'play': S.playing = !S.playing; render(); break;
      case 'yes': yes(); break;
      case 'no': S.rejected = true; if (S.pending) S.pending.state = 'search'; clear(); S.playing = false; S.stack = [{s: 'home'}]; toast('Thanks. We’ll keep looking and won’t suggest this song again.'); break;
      case 'unlock': clear(); S.stack = [{s: 'home'}]; render(); break;
      case 'nope': S.overlay = null; nope(); break;
    }
  });

  function fit() {
    const avW = Math.min(host.getBoundingClientRect().width || 393, 413) - 22;
    const avH = Math.max(560, window.innerHeight - 150);
    scale = Math.min(1, avW / 393, avH / 852);
    ph.style.transform = 'scale(' + scale + ')';
    box.style.width = 393 * scale + 'px'; box.style.height = 852 * scale + 'px'; box.style.margin = (11 * scale) + 'px';
  }
  window.addEventListener('resize', fit);
  fit(); render();

  return {
    get state() { return S; },
    top,
    reset() { clear(); clearTimeout(toastT); S = fresh(); render(); },
    set(o) { Object.assign(S, o); render(); },
    hint(k) { S.hint = k; render(); },
    skip,
    yes,
    setSound(v) { S.sound = v; render(); },
    render,
    onChange(f) { subs.push(f); }
  };
}
return {mount, HEARD};
})();

</script>
<div class="guide">
  <div class="top"><a class="pill" href="index.html">← Prototype</a>
    <div class="about"><button class="about-btn" id="about-btn" type="button" aria-expanded="false" aria-controls="about-pop" aria-label="About this walkthrough">i</button>
      <div class="about-pop" id="about-pop" role="note" hidden><b>Independent product concept.</b> Not affiliated with Apple or Shazam. Songs and artists are invented. Built by Pritesh Kabra.</div></div></div>
  <div class="gstage">
    <div id="phone"></div>
    <section class="card" aria-live="polite">
      <div class="kicker" id="w-k"></div>
      <h2 id="w-title"></h2>
      <div class="rows"><div><b>Today</b><span id="w-today"></span></div><div class="n"><b>New</b><span id="w-new"></span></div></div>
      <p class="try" id="w-do"></p>
      <div class="ctrl"><button class="btn" id="prev" type="button">Back</button><button class="btn pri" id="next" type="button">Next</button><button class="btn" id="restart" type="button">Start over</button></div>
      <ol class="steps" id="steps"></ol>
    </section>
  </div>
</div>
<script>
const api = SZ.mount(document.getElementById('phone'));
const S = () => api.state;
const STEPS = [
 {t: 'Tap to Shazam', setup: () => api.reset(), hint: 'shazam',
  today: 'Shazam listens, widens the search, then makes a last try.',
  now: 'Unchanged. The first tap is exactly as fast as today.',
  doit: 'Tap the Shazam button and wait a few seconds.', done: s => api.top().s === 'miss'},
 {t: 'A miss becomes a “not yet”', setup: () => { api.reset(); api.set({pending: {when: SZ.HEARD, tries: 1, state: 'search'}, stack: [{s: 'home'}, {s: 'miss'}]}); }, hint: 'lyrics-btn',
  today: '“No Result. We didn’t quite catch that.” One button: Try Again. Nothing is saved.',
  now: 'Shazam heard music, so it keeps the thumbprint (codes, never audio) and searches harder for 30 days: other speeds, every country’s catalogue, new releases.',
  doit: 'Tap “Remember any words? Search lyrics”.', done: s => api.top().s === 'lyrics'},
 {t: 'Search by lyrics, right away', setup: () => { api.reset(); api.set({pending: {when: SZ.HEARD, tries: 1, state: 'search'}, q: '', stack: [{s: 'home'}, {s: 'miss'}, {s: 'lyrics', mode: 'lyrics'}]}); }, hint: ['lyr-q', 'none'],
  today: 'Search Songs exists, but nothing leads you to it after a miss.',
  now: 'The miss screen offers a lyrics search. If nothing matches, the deeper search carries on.',
  doit: 'Type “dhol vajto”, then tap “None of these. Keep looking”.', done: s => s.lyrNone},
 {t: 'Noise isn’t saved', setup: () => { api.reset(); api.set({sound: 'talk'}); }, hint: 'shazam',
  today: 'Every failure shows the same “No Result”, whether Shazam heard a song or people talking.',
  now: 'Shazam checks for music first. No music: it says so, and nothing is saved, so no junk and no false alarms later.',
  doit: 'People are talking here. Tap Shazam.', done: s => api.top().s === 'nomusic'},
 {t: 'Still looking, in plain sight', setup: () => { api.reset(); api.set({pending: {when: SZ.HEARD, tries: 1, state: 'search'}}); }, hint: 'tab-lib',
  today: 'A miss leaves no trace anywhere in the app.',
  now: 'A “Still looking” card shows what Shazam is trying and how many days are left. You can stop it anytime.',
  doit: 'Open Library.', done: s => api.top().s === 'library'},
 {t: 'Is this your song?', setup: () => { api.reset(); api.set({pending: {when: SZ.HEARD, tries: 1, state: 'search'}}); api.skip(); }, hint: ['notif', 'play', 'yes'],
  today: 'The song is lost for good.',
  now: 'A late match must pass a stricter bar, and you confirm it by hearing the exact part you caught. Nothing reaches Library without your yes.',
  doit: 'Tap the notification, play the part you heard, then tap “Yes, that’s it”.', done: s => s.confirmed},
 {t: 'Back to the moment', setup: () => { api.reset(); api.yes(); }, hint: 'open-Spotify',
  today: 'Not possible today.',
  now: 'The song, when you heard it and the part you caught. Spotify and Apple Music get equal buttons.',
  doit: 'Tap “Open in Spotify”.', done: s => s.opened},
 {t: 'Report a bad rescue', setup: () => { api.reset(); api.yes(); api.set({stack: [{s: 'library'}]}); }, hint: ['more-cd', 'report'],
  today: '“Wrong Song? Tell Shazam” already sits in each song’s ••• menu.',
  now: 'The same menu covers rescued songs, so a wrong rescue can be reported with no new screen. Reports feed the accuracy guardrail.',
  doit: 'Tap ••• on Chandani Dhol, then “Wrong Song? Tell Shazam”.', done: s => s.reported},
 {t: 'In your control', setup: () => { api.reset(); api.set({stack: [{s: 'home'}, {s: 'settings'}]}); }, hint: 'tog-keepOn',
  today: 'There is no such setting.',
  now: 'Keep Looking sits with the other preferences. Turn it off and a miss goes back to today’s “No Result”.',
  doit: 'Turn off “Keep looking after a miss”.', done: s => !s.keepOn}
];
let cur = 0;
const list = document.getElementById('steps');
list.innerHTML = STEPS.map((st, i) => `<li><button type="button" data-i="${i}"><span class="num">${i + 1}</span>${st.t}</button></li>`).join('');
list.onclick = e => { const b = e.target.closest('button'); if (b) show(+b.dataset.i); };
function show(i) { cur = i; STEPS[i].setup(); api.hint(STEPS[i].hint); paint(); }
function paint() {
  const st = STEPS[cur], d = st.done(S());
  document.getElementById('w-k').textContent = `Step ${cur + 1} of ${STEPS.length}`;
  document.getElementById('w-title').textContent = st.t;
  document.getElementById('w-today').textContent = st.today;
  document.getElementById('w-new').textContent = st.now;
  document.getElementById('w-do').innerHTML = d ? `<span class="done">Done.</span> ${cur < STEPS.length - 1 ? 'Tap Next.' : 'That’s the whole flow.'}` : '<b>Do:</b> ' + st.doit;
  document.getElementById('prev').disabled = cur === 0;
  document.getElementById('next').disabled = cur === STEPS.length - 1;
  [...list.querySelectorAll('button')].forEach((b, i) => b.setAttribute('aria-current', String(i === cur)));
}
api.onChange(() => { if (typeof cur === 'number' && document.getElementById('w-k')) paint(); });
document.getElementById('next').onclick = () => cur < STEPS.length - 1 && show(cur + 1);
document.getElementById('prev').onclick = () => cur > 0 && show(cur - 1);
document.getElementById('restart').onclick = () => show(0);
const ab = document.getElementById('about-btn'), ap = document.getElementById('about-pop');
ab.onclick = e => { e.stopPropagation(); ap.hidden = !ap.hidden; ab.setAttribute('aria-expanded', String(!ap.hidden)); };
document.addEventListener('click', e => { if (!e.target.closest('.about')) { ap.hidden = true; ab.setAttribute('aria-expanded', 'false'); } });
show(0);
</script>
</body>
